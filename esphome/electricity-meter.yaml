# Reader for the P1 port of an Israeli IEC Kaifa three-phase smart meter.
# ESP32 30-pin, ESPHome 2025.11, ESP-IDF framework.
# All passwords come from secrets.yaml. See secrets.example.yaml.

esphome:
  name: electricity-meter
  friendly_name: Electricity meter

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Electricity-Meter"
    password: !secret ap_password

captive_portal:

uart:
  id: uart_p1
  rx_pin:
    number: GPIO16
    inverted: true
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 2048
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r\n"
    sequence:
      - lambda: |-
          // Buffers one telegram and publishes it only if its CRC16 is valid.
          // The dsmr component does not know the Israeli 1.8.11-13 energy codes.
          static uint16_t crc = 0;
          static bool in_telegram = false;
          static std::vector<std::pair<sensor::Sensor *, float>> pending;

          const std::pair<const char *, sensor::Sensor *> fields[] = {
              {"1-0:1.8.11", id(energy_t1)},    {"1-0:1.8.12", id(energy_t2)},
              {"1-0:1.8.13", id(energy_t3)},    {"1-0:2.8.11", id(export_t1)},
              {"1-0:2.8.12", id(export_t2)},    {"1-0:2.8.13", id(export_t3)},
              {"0-0:96.14.1", id(tariff)},      {"1-0:1.7.0", id(power)},
              {"1-0:2.7.0", id(power_export)},  {"1-0:21.7.0", id(power_l1)},
              {"1-0:41.7.0", id(power_l2)},     {"1-0:61.7.0", id(power_l3)},
              {"1-0:32.7.0", id(voltage_l1)},   {"1-0:52.7.0", id(voltage_l2)},
              {"1-0:72.7.0", id(voltage_l3)},   {"1-0:31.7.0", id(current_l1)},
              {"1-0:51.7.0", id(current_l2)},   {"1-0:71.7.0", id(current_l3)},
          };

          std::string line(bytes.begin(), bytes.end());
          if (line.empty()) return;
          if (line[0] == '/') {
            crc = 0;
            in_telegram = true;
            pending.clear();
          }
          if (!in_telegram) return;

          // The CRC covers everything from '/' up to and including '!'
          const bool is_footer = line[0] == '!';
          const size_t crc_length = is_footer ? 1 : line.size();
          for (size_t i = 0; i < crc_length; i++) {
            crc ^= (uint8_t) line[i];
            for (int bit = 0; bit < 8; bit++)
              crc = (crc & 1) ? (crc >> 1) ^ 0xA001 : crc >> 1;
          }

          if (is_footer) {
            in_telegram = false;
            if (strtoul(line.c_str() + 1, nullptr, 16) != crc) {
              ESP_LOGW("p1", "Telegram dropped: bad CRC");
              return;
            }
            for (auto &item : pending) item.first->publish_state(item.second);
            return;
          }

          const size_t paren = line.find('(');
          if (paren == std::string::npos) return;
          const std::string obis = line.substr(0, paren);
          for (auto &field : fields) {
            if (obis == field.first) {
              pending.push_back({field.second, strtof(line.c_str() + paren + 1, nullptr)});
              break;
            }
          }

sensor:
  # Energy: stored once a minute
  - &energy
    platform: template
    id: energy_t1
    name: "Energy T1"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: never
    filters:
      - throttle: 60s
  - {<<: *energy, id: energy_t2, name: "Energy T2"}
  - {<<: *energy, id: energy_t3, name: "Energy T3"}
  - {<<: *energy, id: export_t1, name: "Export T1"}
  - {<<: *energy, id: export_t2, name: "Export T2"}
  - {<<: *energy, id: export_t3, name: "Export T3"}

  - platform: template
    name: "Energy Total"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      const float total = id(energy_t1).state + id(energy_t2).state + id(energy_t3).state;
      return isnan(total) ? NAN : total;
  - platform: template
    name: "Export Total"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      const float total = id(export_t1).state + id(export_t2).state + id(export_t3).state;
      return isnan(total) ? NAN : total;

  # Live values: updated every 5 seconds
  - &power
    platform: template
    id: power
    name: "Power"
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    filters:
      - throttle: 5s
  - {<<: *power, id: power_export, name: "Power Export"}
  - {<<: *power, id: power_l1, name: "Power L1"}
  - {<<: *power, id: power_l2, name: "Power L2"}
  - {<<: *power, id: power_l3, name: "Power L3"}

  - &voltage
    <<: *power
    id: voltage_l1
    name: "Voltage L1"
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 1
  - {<<: *voltage, id: voltage_l2, name: "Voltage L2"}
  - {<<: *voltage, id: voltage_l3, name: "Voltage L3"}

  - &current
    <<: *power
    id: current_l1
    name: "Current L1"
    unit_of_measurement: A
    device_class: current
    accuracy_decimals: 1
  - {<<: *current, id: current_l2, name: "Current L2"}
  - {<<: *current, id: current_l3, name: "Current L3"}

  - platform: template
    id: tariff
    name: "Active Tariff"
    icon: mdi:cash-clock
    accuracy_decimals: 0
    update_interval: never
    filters:
      - throttle: 60s
